name: CD

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "--dry-run"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run zip:${{ matrix.browser }}
      - name: Publish
        run: |
          if [ "${{ github.event.inputs.dry_run || 'false' }}" = "false" ]; then
            bunx wxt submit
          else
            bunx wxt submit --dry-run
          fi
        env:
          CHROME_ZIP: ${{ matrix.browser == 'chrome' && 'dist/chrome.zip' || '' }}
          CHROME_EXTENSION_ID: "lcgfhpllcjejniehjnhbfhnkdpmkeoce"
          CHROME_API_VERSION: "v2"
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
          CHROME_PUBLISH_TYPE: "DEFAULT_PUBLISH"
          CHROME_SKIP_SUBMIT_REVIEW: false
          FIREFOX_ZIP: ${{ matrix.browser == 'firefox' && 'dist/firefox.zip' || '' }}
          FIREFOX_SOURCES_ZIP: ${{ matrix.browser == 'firefox' && 'dist/sources.zip' || '' }}
          FIREFOX_EXTENSION_ID: "youtube-play-all"
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
          FIREFOX_CHANNEL: "listed"
